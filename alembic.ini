[alembic]
# Путь к папке с миграциями
script_location = alembic

# Шаблон именования файлов миграций (дата + slug)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s

# Часовой пояс для имён файлов
timezone = UTC

# Подключение к БД (переопределяется в env.py через переменные окружения)
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/dbname

[post_write_hooks]
# Форматирование сгенерированных миграций через black
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S