# ============================================================================
# Docker Compose — Production Control
# Запуск:  docker compose up -d --build
# Логи:   docker compose logs -f api
# Стоп:   docker compose down
# ============================================================================

services:
  # ==========================================================================
  # Инфраструктура
  # ==========================================================================

  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: pc_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-product_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-product_password}
      POSTGRES_DB: ${DB_NAME:-product_control}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-product_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: pc_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- RabbitMQ 3.13 (с management UI) ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pc_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"   # AMQP
      - "15672:15672"                     # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- MinIO (S3-compatible storage) ---
  minio:
    image: minio/minio
    container_name: pc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"   # S3 API
      - "9001:9001"                   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Приложение
  # ==========================================================================

  # --- FastAPI (Uvicorn) ---
  api:
    build: .
    container_name: pc_api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # --- Celery Worker ---
  celery-worker:
    build: .
    container_name: pc_celery_worker
    command: >
      celery -A src.celery_app:celery_app worker
      --loglevel=info
      --queues=default,reports,imports
      --concurrency=4
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- Celery Beat (планировщик) ---
  celery-beat:
    build: .
    container_name: pc_celery_beat
    command: >
      celery -A src.celery_app:celery_app beat
      --loglevel=info
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- Flower (мониторинг Celery) ---
  flower:
    build: .
    container_name: pc_flower
    command: >
      celery -A src.celery_app:celery_app flower
      --port=5555
      --broker_api=http://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:15672/api/
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

# ============================================================================
# Volumes — именованные тома для персистентного хранения
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
